<script src="https://realphy.unibas.ch/js/jquery.min.js"></script>
<script>
 $(document).ready(function() {
     var prjdir = "data_utaxfw1o";
     var ptype = "bare";
     if (window.location.hostname.includes("realphy.unibas.ch")) {
	 $.get("https://realphy.unibas.ch/log_interaction/?dir=" + prjdir + "&int=main&ptype=" + ptype);
	 $('.logint').bind({
	     click: function() {
		 var log_val = $(this).data("logint");
		 $.get("https://realphy.unibas.ch/log_interaction/?dir=" + prjdir + "&int=" + log_val + "&ptype=" + ptype);
	     }
	 });
     }

     $("#recophy_run").bind({
         click: function(){
             $.get("https://realphy.unibas.ch/realphy/afterrun?sd=" + prjdir,
                   function(data){
                       if (data.includes("Error:")) {
                           alert(data);
                       } else {
                           window.location = "https://recophy.unibas.ch/RECOPHY/scratch/" + prjdir +"/report/recophy_status.html"
                       }
                   }
             );
         }
     });
     const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
     const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
 });
</script>

<!-- Matomo -->
